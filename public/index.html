<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Realtime Subtitle Translator</title>
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <main class="container">
    <h1>Realtime Subtitle Translator</h1>
    <p class="description">マイク入力を逐次翻訳し、字幕オーバーレイ表示します。</p>

    <section class="controls">
      <label>
        入力言語
        <select id="sourceLanguage"></select>
      </label>
      <label>
        出力言語
        <select id="targetLanguage"></select>
      </label>
      <label>
        モード
        <select id="mode">
          <option value="low_latency">低遅延</option>
          <option value="high_accuracy" selected>高精度</option>
        </select>
      </label>

      <label id="overlayToggleWrap" class="overlay-toggle" hidden>
        <input id="overlayToggle" type="checkbox" checked />
        PCオーバーレイ表示
      </label>

      <button id="startBtn" type="button">開始</button>
      <button id="stopBtn" type="button" disabled>停止</button>
    </section>

    <p id="status" class="status">待機中</p>
    <section class="mic-panel">
      <div class="mic-row">
        <span>マイク入力</span>
        <span id="micStatusText" class="mic-state idle">待機中</span>
      </div>
      <div class="meter-track">
        <div id="micLevelBar" class="meter-bar"></div>
      </div>
    </section>

    <section class="settings-panel">
      <h2>Context File</h2>
      <div class="context-actions">
        <input
          id="contextFile"
          type="file"
          accept=".pdf,.pptx,.docx,.txt,.md,.rtf,application/pdf,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,text/markdown"
        />
        <button id="uploadContextBtn" type="button">追加</button>
        <button id="clearContextBtn" type="button">全削除</button>
      </div>
      <p id="contextStatus" class="context-status">未設定</p>
      <ul id="contextList" class="context-list"></ul>
      <div class="context-preview-actions">
        <select id="contextPreviewTarget" hidden></select>
        <button id="viewContextBtn" type="button">内容を表示</button>
        <button id="prevContextBtn" type="button" hidden>前へ</button>
        <button id="nextContextBtn" type="button" hidden>次へ</button>
        <span id="contextPreviewMeta" class="context-preview-meta" hidden>0 / 0</span>
      </div>
      <pre id="contextPreview" class="context-preview" hidden>Context未設定</pre>
    </section>

    <section class="settings-panel">
      <h2>Glossary</h2>
      <div class="glossary-form">
        <input id="glossarySource" type="text" placeholder="原文用語 (例: AI Agent)" />
        <input id="glossaryTarget" type="text" placeholder="訳語 (例: AIエージェント)" />
        <input id="glossaryNotes" type="text" placeholder="メモ (任意)" />
        <button id="addGlossaryBtn" type="button">用語を追加</button>
      </div>
      <p id="glossaryStatus" class="context-status">未登録</p>
      <ul id="glossaryList" class="context-list"></ul>
    </section>

    <section class="settings-panel">
      <h2>API設定</h2>
      <div class="api-config-top">
        <label class="api-key-field">
          OpenAI API Key
          <input id="openaiApiKey" type="password" autocomplete="off" placeholder="sk-..." />
        </label>
        <div class="api-config-actions">
          <button id="saveApiConfigBtn" type="button">API設定を保存</button>
          <button id="clearApiKeyBtn" type="button">API Keyを削除</button>
        </div>
      </div>
      <details class="settings-collapse">
        <summary>詳細設定（Base URL / モデル）</summary>
        <div class="settings-grid api-settings-grid">
          <label>
            OpenAI Base URL
            <input id="openaiBaseUrl" type="text" placeholder="https://api.openai.com/v1" />
          </label>
          <label>
            翻訳モデル
            <input id="openaiTranslationModel" type="text" placeholder="gpt-4.1-mini" />
          </label>
          <label>
            埋め込みモデル
            <input id="openaiEmbeddingModel" type="text" placeholder="text-embedding-3-small" />
          </label>
          <label>
            音声認識モデル（低遅延）
            <input id="openaiTranscribeLowModel" type="text" placeholder="gpt-4o-mini-transcribe" />
          </label>
          <label>
            音声認識モデル（高精度）
            <input id="openaiTranscribeHighModel" type="text" placeholder="gpt-4o-transcribe" />
          </label>
        </div>
      </details>
      <p id="apiConfigStatus" class="context-status">読み込み中...</p>
    </section>

    <section class="settings-panel">
      <h2>チューニング</h2>
      <details class="settings-collapse">
        <summary>詳細設定を表示</summary>
        <div class="settings-grid">
          <label>
            低遅延 セグメント(ms)
            <input id="segLowMs" type="number" min="700" max="5000" step="100" value="1800" />
          </label>
          <label>
            高精度 セグメント(ms)
            <input id="segHighMs" type="number" min="1500" max="9000" step="100" value="5200" />
          </label>
          <label>
            低遅延 flush最小文字数
            <input id="flushCharsLow" type="number" min="12" max="180" step="1" value="38" />
          </label>
          <label>
            高精度 flush最小文字数
            <input id="flushCharsHigh" type="number" min="12" max="260" step="1" value="88" />
          </label>
          <label>
            低遅延 flush最大待機(ms)
            <input id="flushHoldLowMs" type="number" min="1200" max="14000" step="100" value="5400" />
          </label>
          <label>
            高精度 flush最大待機(ms)
            <input id="flushHoldHighMs" type="number" min="1800" max="18000" step="100" value="12000" />
          </label>
          <label>
            ノイズゲート閾値
            <input id="noiseThreshold" type="range" min="0.005" max="0.08" step="0.001" value="0.016" />
            <span id="noiseThresholdValue" class="value-badge">0.016</span>
          </label>
          <label>
            最小音声検出(ms)
            <input id="noiseMinVoiceMs" type="number" min="40" max="1200" step="10" value="180" />
          </label>
          <label class="checkbox-row">
            <input id="ignoreFillers" type="checkbox" checked />
            フィラーを除去
          </label>
          <label class="checkbox-row">
            <input id="useContextTranscription" type="checkbox" checked />
            contextを音声認識に利用
          </label>
          <label class="checkbox-row">
            <input id="useContextTranslation" type="checkbox" checked />
            contextを翻訳に利用
          </label>
        </div>
      </details>
    </section>

    <section class="settings-panel">
      <h2>オーバーレイ表示</h2>
      <details class="settings-collapse">
        <summary>表示スタイル設定を表示</summary>
        <div class="settings-grid">
          <label>
            文字サイズ(px)
            <input id="overlayFontSize" type="number" min="14" max="96" step="1" value="32" />
          </label>
          <label>
            下オフセット(px)
            <input id="overlayBottom" type="number" min="0" max="200" step="1" value="14" />
          </label>
          <label>
            文字色
            <input id="overlayTextColor" type="color" value="#ffffff" />
          </label>
          <label>
            背景色
            <input id="overlayBgColor" type="color" value="#000000" />
          </label>
          <label>
            背景不透明度
            <input id="overlayBgOpacity" type="range" min="0.2" max="1" step="0.01" value="0.78" />
            <span id="overlayBgOpacityValue" class="value-badge">0.78</span>
          </label>
          <label>
            角丸(px)
            <input id="overlayRadius" type="number" min="0" max="40" step="1" value="10" />
          </label>
        </div>
      </details>
    </section>

    <section class="history-panel">
      <h2>履歴（ローカル保存）</h2>
      <div class="history-actions">
        <button id="exportHistoryBtn" type="button">会話ログ(VTT)を書き出し</button>
        <button id="clearHistoryBtn" type="button">履歴をクリア</button>
      </div>
      <ul id="historyList"></ul>
    </section>
  </main>

  <div id="subtitleOverlay" class="subtitle-overlay" aria-live="polite"></div>

  <script src="/app.js" type="module"></script>
</body>

</html>
